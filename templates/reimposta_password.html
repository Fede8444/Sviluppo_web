<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reimposta password - ElectroShop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="contenitore">
        <h1>Reimposta password</h1>
        <p class="sottotitolo">Inserisci la tua nuova password.</p>

        {% if errore %}
            <p class="errore">{{ errore }}</p>
        {% endif %}

        <p>La password deve contenere:</p>
        <ul>
            <li>Almeno 8 caratteri</li>
            <li>Almeno una lettera maiuscola</li>
            <li>Almeno una lettera minuscola</li>
            <li>Almeno un numero</li>
            <li>Almeno un carattere speciale</li>
        </ul>

        <form method="POST">

            <label for="password">Nuova password</label>
            <input type="password" id="password" name="password" placeholder="Nuova password" required>

            <label for="conferma_password">Conferma password</label>
            <input type="password" id="conferma_password" name="conferma_password" placeholder="Conferma password" required>

            <button type="submit">Salva nuova password</button>

        </form>
    </div>

</body>
</html>
