<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form - TEPSIT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="contenitore">
        <h1>Compilazione form</h1>
        <p class="sottotitolo">Benvenuto! Compila i campi qui sotto.</p>

        {% with messaggi = get_flashed_messages() %}
            {% for messaggio in messaggi %}
                <p class="successo">{{ messaggio }}</p>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('invia') }}" method="POST">

            <label for="nome">Nome</label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Inserisci il tuo nome"
                required
            >

            <label for="messaggio">Messaggio</label>
            <textarea
                id="messaggio"
                name="messaggio"
                placeholder="Scrivi un messaggio..."
                required
            ></textarea>

            <button type="submit">Invia dati</button>

        </form>

        {% if risultato %}
            <p class="successo">{{ risultato }}</p>
        {% endif %}

        <a class="link-logout" href="{{ url_for('logout') }}">Esci</a>
    </div>

</body>
</html>
