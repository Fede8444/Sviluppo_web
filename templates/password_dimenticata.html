
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password dimenticata - ElectroShop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="contenitore">
        <h1>Password dimenticata</h1>
        <p class="sottotitolo">Inserisci la tua email per ricevere il codice di verifica e reimpostare la password.</p>

        {% if errore %}
            <p class="errore">{{ errore }}</p>
        {% endif %}

        <form method="POST">

            <label for="username">Email</label>
            <input type="email" id="username" name="username" placeholder="Inserisci la tua email" required>

            <button type="submit">Invia codice</button>

        </form>

        <p>
            <a href="{{ url_for('login') }}">Torna al login</a>
        </p>
    </div>

</body>
</html>
